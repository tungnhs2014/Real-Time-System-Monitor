# Raspberry Pi 3 64-bit manual ILI9341/XPT2046 bring-up image.
# Copy this file to poky/build/conf/local.conf after initializing the build
# directory. Layer registration is intentionally handled by bitbake-layers.

MACHINE ??= "raspberrypi3-64"
DISTRO ?= "poky"
PACKAGE_CLASSES ?= "package_ipk"

DL_DIR ?= "${TOPDIR}/../downloads"
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"
BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"

DISTRO_FEATURES:append = " systemd wifi"
DISTRO_FEATURES:remove = " x11 wayland vulkan sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

ENABLE_UART = "1"
ENABLE_SPI_BUS = "1"
ENABLE_I2C = "1"
GPU_MEM = "64"

MACHINE_EXTRA_RRECOMMENDS:remove = "kernel-modules"
MACHINE_EXTRA_RRECOMMENDS:remove = "bluez-firmware-rpidistro-bcm43430a1-hcd bluez-firmware-rpidistro-bcm4345c0-hcd"

PACKAGECONFIG:append:pn-qtbase = " linuxfb tslib"
PACKAGECONFIG:remove:pn-qtbase = " xcb xkbcommon"

# Runtime for a system-monitor binary copied through SCP.
IMAGE_INSTALL:append = " \
    qtbase \
    qtbase-plugins \
    qtdeclarative \
    qtdeclarative-qmlplugins \
    fontconfig \
    ttf-dejavu-sans \
"

# Board access, SCP, and persistent manual Wi-Fi configuration.
IMAGE_INSTALL:append = " \
    openssh \
    openssh-scp \
    openssh-sftp-server \
    rsync \
    dhcpcd \
    wpa-supplicant \
    wpa-supplicant-cli \
    wpa-supplicant-passphrase \
    iw \
    iproute2 \
    iputils \
"

# Raspberry Pi onboard Broadcom Wi-Fi support without full kernel-modules.
IMAGE_INSTALL:append = " \
    kernel-module-brcmfmac \
    kernel-module-brcmutil \
    kernel-module-cfg80211 \
    linux-firmware-rpidistro-bcm43430 \
    linux-firmware-rpidistro-bcm43455 \
    wireless-regdb-static \
"

# Dependencies and diagnostics for manually copied framebuffer modules.
IMAGE_INSTALL:append = " \
    kmod \
    kernel-module-fb-sys-fops \
    kernel-module-syscopyarea \
    kernel-module-sysfillrect \
    kernel-module-sysimgblt \
    evtest \
    fbset \
    nano \
    less \
    procps \
    psmisc \
"

# Temporary isolated-lab access for UART and SSH bring-up.
EXTRA_IMAGE_FEATURES = "debug-tweaks ssh-server-openssh package-management"
IMAGE_FSTYPES = "rpi-sdimg ext4 tar.xz"
IMAGE_ROOTFS_EXTRA_SPACE = "262144"

LDGOLD:pn-binutils = "--disable-gold"
PATCHRESOLVE = "noop"
CONF_VERSION = "2"
USER_CLASSES ?= "buildstats"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},2G,100K \
    STOPTASKS,${DL_DIR},2G,100K \
    STOPTASKS,${SSTATE_DIR},2G,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K"
